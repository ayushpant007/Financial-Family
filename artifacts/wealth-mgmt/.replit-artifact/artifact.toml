kind = "web"
previewPath = "/"
title = "Client Wealth Management"
version = "1.0.0"
id = "artifacts/wealth-mgmt"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23517

[services.development]
run = "pnpm --filter @workspace/wealth-mgmt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wealth-mgmt", "run", "build" ]
publicDir = "artifacts/wealth-mgmt/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23517"
BASE_PATH = "/"
